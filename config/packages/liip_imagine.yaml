# Documentation on how to configure the bundle can be found at: https://symfony.com/doc/current/bundles/LiipImagineBundle/basic-usage.html
liip_imagine:
    # Moteur de traitement d'images (GD sait redimensionner + WebP)
    driver: "gd"

    # Corrige la dépréciation (mode "lazy" recommandé)
    twig:
        mode: lazy

    # Les "recettes" de transformation d'image
    filter_sets:
        vignette:
            format: webp          # sortie en WebP (léger)
            quality: 82           # bon compromis qualité / poids
            filters:
                auto_rotate: ~
                thumbnail:
                    size: [400, 400]   # tient dans un carré de 400×400
                    mode: inset        # garde les proportions (pas de déformation)
        galerie:
            format: webp
            quality: 85
            filters:
                auto_rotate: ~          
                thumbnail:
                    size: [1600, 1600]  # grand format fiche produit
                    mode: inset         # garde les proportions
        macro_tissu:
            format: webp
            quality: 82
            filters:
                auto_rotate: ~
                thumbnail:
                    size: [600, 600]
                    mode: outbound